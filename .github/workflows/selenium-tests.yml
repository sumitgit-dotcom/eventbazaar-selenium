name: Selenium BDD Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Firefox
        run: |
          sudo apt-get install -y firefox

      - name: Install Edge
        run: |
          # On Ubuntu, Edge is usually installed via Microsoft repository; for simplicity, skip here or use Chrome/Firefox only
          # If you must run Edge, you need to add Microsoft apt source, which is more complex
          echo "Edge skipped on Linux runner"

      - name: Run tests
        run: mvn clean test -Dsurefire.suiteXmlFiles=testng.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/cucumber-reports.html